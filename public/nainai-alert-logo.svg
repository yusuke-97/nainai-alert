<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 液体をボトルの内側にピッタリ収めるためのマスク（ボトルの内周と同じ形） -->
    <clipPath id="petClip">
      <path d="M 232 118 V 140 C 232 180, 176 190, 176 230 V 390 C 176 430, 206 440, 256 440 C 306 440, 336 430, 336 390 V 230 C 336 190, 280 180, 280 140 V 118 Z" />
    </clipPath>
  </defs>

  <!-- 背景の丸要素を削除し、透過化 -->

  <!-- 底の液体（残りわずかのレッド。波打つデザイン） -->
  <g clip-path="url(#petClip)">
    <path d="M 150 365 Q 206 350 256 365 T 362 365 V 460 H 150 Z" fill="#FF5252" />
  </g>

  <!-- ボトルの線画（リアルで洗練されたペットボトルの形状） -->
  <g fill="none" stroke="#374151" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
    <!-- キャップ部分（スクリューキャップのリアルな形） -->
    <path d="M 228 106 V 76 C 228 70, 234 64, 240 64 H 272 C 278 64, 284 70, 284 76 V 106" />
    
    <!-- ネックのリング（ペットボトル特有の首元の輪っか） -->
    <rect x="218" y="106" width="76" height="12" rx="6" />
    
    <!-- ボトル本体（なだらかな肩のラインと、底に向けてのカーブ） -->
    <path d="M 232 118 V 140 C 232 180, 176 190, 176 230 V 390 C 176 430, 206 440, 256 440 C 306 440, 336 430, 336 390 V 230 C 336 190, 280 180, 280 140 V 118 Z" />

    <!-- ペットボトル特有の「くぼみ（リブ）」デザイン -->
    <path d="M 176 260 Q 256 280 336 260" stroke-width="8" opacity="0.6" />
    <path d="M 176 310 Q 256 330 336 310" stroke-width="8" opacity="0.6" />
  </g>

  <!-- ゲージの目盛り（ツールっぽさのアクセント） -->
  <g stroke="#374151" stroke-width="8" stroke-linecap="round">
    <line x1="366" y1="230" x2="386" y2="230" />
    <line x1="366" y1="290" x2="386" y2="290" />
    <line x1="366" y1="350" x2="386" y2="350" />
  </g>
</svg>
